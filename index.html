<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Hybrid Dot–Dash</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,system-ui;
}

body{

background:
linear-gradient(
180deg,
#fff,
#f5f7fa
);

display:flex;
justify-content:center;

padding:60px;

color:#111;

}

.container{

width:min(1200px,100%);

}

.hero{

text-align:center;

margin-bottom:40px;

}

h1{

font-size:68px;

font-weight:700;

background:
linear-gradient(
90deg,
#111,
#555
);

-webkit-background-clip:text;

color:transparent;

}

.subtitle{

color:#666;

margin-top:14px;

}

.panel{

padding:30px;

border-radius:34px;

background:
rgba(255,255,255,.72);

backdrop-filter:
blur(40px);

box-shadow:
0 30px 80px rgba(0,0,0,.08);

}

.controls{

display:flex;

gap:14px;

justify-content:center;

align-items:center;

flex-wrap:wrap;

margin-bottom:28px;

}

.fileWrap{

height:56px;

padding:0 22px;

display:flex;

align-items:center;

background:#f3f4f6;

border-radius:999px;

}

input[type=file]{

font-size:15px;

}

button{

height:56px;

padding:0 26px;

border:none;

border-radius:999px;

cursor:pointer;

font-size:15px;

background:
linear-gradient(
90deg,
#111,
#444
);

color:white;

transition:.25s;

}

button:hover{

transform:
translateY(-2px);

}

canvas{

width:100%;

background:white;

border-radius:24px;

}

.footer{

text-align:center;

margin-top:18px;

color:#777;

}

</style>

</head>

<body>

<div class="container">

<div class="hero">

<h1>Hybrid Dot–Dash</h1>

<div class="subtitle">

Upload → Generate → Regenerate → Export

</div>

</div>

<div class="panel">

<div class="controls">

<label class="fileWrap">

<input
id="upload"
type="file"
accept="image/*">

</label>

<button id="generate">
Generate
</button>

<button id="regen">
Regenerate
</button>

<button id="download">
Export PNG
</button>

</div>

<canvas id="canvas"></canvas>

</div>

<div class="footer">

Pure white background • Hybrid particle abstraction

</div>

</div>

<script>

const canvas=
document.getElementById(
"canvas"
);

const ctx=
canvas.getContext(
"2d"
);

canvas.width=1400;
canvas.height=1400;

let img=null;

let seed=
0;

function clear(){

ctx.fillStyle=
"#fff";

ctx.fillRect(
0,
0,
1400,
1400
);

}

clear();

upload.onchange=e=>{

const file=
e.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=()=>{

img=
new Image();

img.onload=()=>{

clear();

preview();

};

img.src=
reader.result;

};

reader.readAsDataURL(file);

};

function fit(){

let scale=
Math.min(
1100/img.width,
1100/img.height
);

return{

w:
img.width*
scale,

h:
img.height*
scale,

x:
(
1400-
img.width*
scale
)/2,

y:
(
1400-
img.height*
scale
)/2

};

}

function preview(){

clear();

let s=
fit();

ctx.drawImage(
img,
s.x,
s.y,
s.w,
s.h
);

}

generate.onclick=()=>{

seed=
Math.random();

render();

};

regen.onclick=()=>{

if(!img)return;

seed=
Math.random();

render();

};

function random(){

seed=
(
seed*
9301+
49297
)%233280;

return seed/
233280;

}

function render(){

if(!img)return;

clear();

const temp=
document.createElement(
"canvas"
);

temp.width=
1400;

temp.height=
1400;

const t=
temp.getContext(
"2d"
);

let s=
fit();

t.drawImage(
img,
s.x,
s.y,
s.w,
s.h
);

let data=
t.getImageData(
0,
0,
1400,
1400
).data;

for(

let y=0;

y<1400;

y+=7

){

for(

let x=0;

x<1400;

x+=7

){

let i=
(
y*
1400+
x
)
*4;

let r=
data[i];

let g=
data[i+1];

let b=
data[i+2];

let brightness=
(
r+
g+
b
)/3;

if(
brightness>
245
)
continue;

let density=
(
255-
brightness
)/255;

if(
random()
>
density*
0.55
)
continue;

ctx.fillStyle=
`rgb(${r},${g},${b})`;

let size=

6+
density*
18;

let type=
random();

let dx=
(
random()-
.5
)
*8;

let dy=
(
random()-
.5
)
*8;

if(
type<
0.30
){

ctx.beginPath();

ctx.arc(

x+dx,
y+dy,

size*.6,

0,

7

);

ctx.fill();

}

else{

let w=

size*
(
1+
random()*4
);

let h=

size*
(
0.45+
random()*.6
);

capsule(
x+dx,
y+dy,
w,
h
);

}

}

}

}

function capsule(
x,
y,
w,
h
){

ctx.beginPath();

ctx.roundRect(
x,
y,
w,
h,
h
);

ctx.fill();

}

download.onclick=()=>{

const a=
document.createElement(
"a"
);

a.href=
canvas.toDataURL();

a.download=
"hybrid-dot-dash.png";

a.click();

};

</script>

</body>

</html>
