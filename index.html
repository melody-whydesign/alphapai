<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

canvas.width = 1400;
canvas.height = 1400;

const upload =
document.getElementById("upload");

const generate =
document.getElementById("generate");

const regen =
document.getElementById("regen");

const download =
document.getElementById("download");

let image = null;
let sourceData = null;
let randomSeed = 1;

function random(){

randomSeed =
(
randomSeed*
16807
)%2147483647;

return (
randomSeed-1
)/2147483646;

}

function clear(){

ctx.fillStyle =
"#fff";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

}

clear();

function fitImage(w,h){

const scale =
Math.min(
1100/w,
1100/h
);

return{

w:
w*scale,

h:
h*scale,

x:
(
1400-
w*scale
)/2,

y:
(
1400-
h*scale
)/2

};

}

upload.addEventListener(
"change",
e=>{

const file =
e.target.files[0];

if(!file)return;

const reader =
new FileReader();

reader.onload =
ev=>{

image =
new Image();

image.onload =
()=>{

buildSource();

preview();

};

image.src =
ev.target.result;

};

reader.readAsDataURL(
file
);

}
);

function buildSource(){

const temp =
document.createElement(
"canvas"
);

temp.width =
1400;

temp.height =
1400;

const t =
temp.getContext(
"2d"
);

t.fillStyle =
"#fff";

t.fillRect(
0,
0,
1400,
1400
);

const s =
fitImage(
image.width,
image.height
);

t.drawImage(
image,
s.x,
s.y,
s.w,
s.h
);

sourceData =
t.getImageData(
0,
0,
1400,
1400
);

}

function preview(){

clear();

const s =
fitImage(
image.width,
image.height
);

ctx.drawImage(
image,
s.x,
s.y,
s.w,
s.h
);

}

function sample(x,y){

const i =
(
Math.floor(y)
*
1400+
Math.floor(x)
)
*4;

const d =
sourceData.data;

return{

r:d[i],
g:d[i+1],
b:d[i+2]

};

}

function brightness(
r,
g,
b
){

return (
r+
g+
b
)/3;

}

function drawCapsule(
x,
y,
w,
h
){

ctx.beginPath();

ctx.roundRect(
x,
y,
w,
h,
h
);

ctx.fill();

}

function render(){

if(!sourceData)
return;

clear();

const PARTICLES =
85000;

for(

let i=0;

i<PARTICLES;

i++

){

let x =
random()
*
1400;

let y =
random()
*
1400;

const c =
sample(
x,
y
);

if(

c.r>248&&
c.g>248&&
c.b>248

)

continue;

const l =
brightness(
c.r,
c.g,
c.b
);

const darkness =
1-
(
l/255
);

if(

random()
>
(
darkness*
0.95+
0.04
)

)

continue;

ctx.fillStyle =
`rgb(
${c.r},
${c.g},
${c.b}
)`;

/* LARGE PARTICLES */

const base =

1.2+

darkness*
9;

const type =
random();

x +=
(
random()-.5
)
*8;

y +=
(
random()-.5
)
*8;

if(
type<
0.32
){

ctx.beginPath();

ctx.arc(

x,
y,

base*.55,

0,

Math.PI*2

);

ctx.fill();

}

else{

let h =

base*
(
0.7+
random()
);

let w =

h*
(
2+
random()*5
);

ctx.save();

ctx.translate(
x,
y
);

ctx.rotate(

(
random()-.5
)
*
0.08

);

drawCapsule(

-w/2,

-h/2,

w,

h

);

ctx.restore();

}

}

}

generate.onclick=
()=>{

randomSeed=
Date.now();

render();

};

regen.onclick=
()=>{

if(!image)
return;

randomSeed+=7;

render();

};

download.onclick=
()=>{

const a =
document.createElement(
"a"
);

a.href =
canvas.toDataURL(
"image/png"
);

a.download =
"particle-raster.png";

a.click();

};

</script>
