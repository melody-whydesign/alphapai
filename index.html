<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Hybrid Dot–Dash</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
Inter,
system-ui;
}

body{

background:
linear-gradient(
180deg,
#ffffff,
#f5f7fa
);

padding:60px;

display:flex;

justify-content:center;

}

.container{

width:min(1200px,100%);

}

.hero{

text-align:center;

margin-bottom:42px;

}

h1{

font-size:70px;

font-weight:700;

letter-spacing:-2px;

background:
linear-gradient(
90deg,
#111,
#666
);

-webkit-background-clip:text;

color:transparent;

}

.sub{

margin-top:14px;

color:#777;

}

.panel{

background:
rgba(255,255,255,.75);

backdrop-filter:
blur(40px);

padding:28px;

border-radius:34px;

box-shadow:
0 20px 80px rgba(0,0,0,.08);

}

.controls{

display:flex;

gap:14px;

justify-content:center;

align-items:center;

flex-wrap:wrap;

margin-bottom:24px;

}

.file{

background:#f3f4f7;

height:56px;

display:flex;

align-items:center;

padding:0 22px;

border-radius:999px;

}

input{

font-size:14px;

}

button{

height:56px;

padding:0 24px;

border:none;

border-radius:999px;

background:
linear-gradient(
90deg,
#111,
#444
);

color:white;

cursor:pointer;

font-size:15px;

}

button:hover{

transform:
translateY(-2px);

}

canvas{

width:100%;

background:white;

border-radius:26px;

display:block;

}

.footer{

text-align:center;

margin-top:18px;

color:#777;

}

</style>

</head>

<body>

<div class="container">

<div class="hero">

<h1>Hybrid Dot–Dash</h1>

<div class="sub">

Upload → Generate → Regenerate → Export

</div>

</div>

<div class="panel">

<div class="controls">

<label class="file">

<input
type="file"
id="upload"
accept="image/*">

</label>

<button id="generate">

Generate

</button>

<button id="regen">

Regenerate

</button>

<button id="save">

Export PNG

</button>

</div>

<canvas id="canvas"></canvas>

</div>

<div class="footer">

Minimal generative particle raster

</div>

</div>

<script>

const canvas=
document.getElementById(
"canvas"
);

const ctx=
canvas.getContext(
"2d"
);

canvas.width=
1600;

canvas.height=
1600;

let img=null;

let buffer=null;

let seed=1;

function rnd(){

seed=
(
seed*
9301+
49297
)%233280;

return seed/
233280;

}

function white(){

ctx.fillStyle=
"#fff";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

}

white();

function fit(){

let s=
Math.min(
1200/img.width,
1200/img.height
);

return{

w:
img.width*s,

h:
img.height*s,

x:
(
1600-
img.width*s
)/2,

y:
(
1600-
img.height*s
)/2

};

}

document
.getElementById(
"upload"
)
.onchange=e=>{

let file=
e.target.files[0];

if(!file)
return;

let r=
new FileReader();

r.onload=()=>{

img=
new Image();

img.onload=()=>{

prepare();

preview();

};

img.src=
r.result;

};

r.readAsDataURL(
file
);

};

function prepare(){

let off=
document.createElement(
"canvas"
);

off.width=
1600;

off.height=
1600;

let o=
off.getContext(
"2d"
);

o.fillStyle=
"#fff";

o.fillRect(
0,
0,
1600,
1600
);

let f=
fit();

o.drawImage(
img,
f.x,
f.y,
f.w,
f.h
);

buffer=
o.getImageData(
0,
0,
1600,
1600
).data;

}

function preview(){

white();

let f=
fit();

ctx.drawImage(
img,
f.x,
f.y,
f.w,
f.h
);

}

function get(x,y){

let i=
(
(
y|0
)
*
1600+
(
x|0
)
)
*4;

return{

r:
buffer[i],

g:
buffer[i+1],

b:
buffer[i+2]

};

}

function lum(
r,
g,
b
){

return
(
r+
g+
b
)/3;

}

function capsule(
x,
y,
w,
h
){

ctx.beginPath();

ctx.roundRect(
x,
y,
w,
h,
h
);

ctx.fill();

}

function render(){

if(!img)
return;

white();

const COUNT=
110000;

for(

let i=0;

i<COUNT;

i++

){

let x=
rnd()*1600;

let y=
rnd()*1600;

let c=
get(
x,
y
);

if(
c.r>245&&
c.g>245&&
c.b>245
)
continue;

let d=

1-
(
lum(
c.r,
c.g,
c.b
)
/255
);

if(

rnd()
>

0.03+
d

)

continue;

ctx.fillStyle=
`rgb(
${c.r},
${c.g},
${c.b}
)`;

/* mostly dashes */

if(
rnd()<0.25
){

let r=

1+

d*5;

ctx.beginPath();

ctx.arc(
x,
y,
r,
0,
7
);

ctx.fill();

}

else{

let h=

1.5+
d*7;

let w=

h*
(
1.5+
rnd()*7
);

ctx.save();

ctx.translate(
x,
y
);

ctx.rotate(
(
rnd()-.5
)
*.08
);

capsule(
-w/2,
-h/2,
w,
h
);

ctx.restore();

}

}

}

document
.getElementById(
"generate"
)
.onclick=()=>{

seed=
Date.now();

render();

};

document
.getElementById(
"regen"
)
.onclick=()=>{

seed+=7;

render();

};

document
.getElementById(
"save"
)
.onclick=()=>{

let a=
document.createElement(
"a"
);

a.href=
canvas.toDataURL();

a.download=
"hybrid-raster.png";

a.click();

};

</script>

</body>

</html>
