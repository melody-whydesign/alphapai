<script>

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

canvas.width=1400;
canvas.height=1400;

let image=null;

let source=null;

let seed=1;

function rng(){

seed=
(
seed*
1664525+
1013904223
)%4294967296;

return seed/
4294967296;

}

function clear(){

ctx.fillStyle=
"#fff";

ctx.fillRect(
0,
0,
1400,
1400);

}

clear();

upload.onchange=(e)=>{

const file=
e.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=()=>{

image=
new Image();

image.onload=()=>{

prepare();

preview();

};

image.src=
reader.result;

};

reader.readAsDataURL(file);

};

function fit(){

const scale=
Math.min(
1100/image.width,
1100/image.height
);

return{

w:
image.width*scale,

h:
image.height*scale,

x:
(
1400-
image.width*scale
)/2,

y:
(
1400-
image.height*scale
)/2

};

}

function prepare(){

const off=
document.createElement(
"canvas"
);

off.width=
1400;

off.height=
1400;

const o=
off.getContext(
"2d"
);

let s=
fit();

o.fillStyle=
"#fff";

o.fillRect(
0,
0,
1400,
1400
);

o.drawImage(
image,
s.x,
s.y,
s.w,
s.h
);

source=
o.getImageData(
0,
0,
1400,
1400
).data;

}

function preview(){

clear();

let s=
fit();

ctx.drawImage(
image,
s.x,
s.y,
s.w,
s.h
);

}

generate.onclick=()=>{
seed=
Date.now();
render();
};

regen.onclick=()=>{
if(!image)return;
seed+=1;
render();
};

function sample(x,y){

let i=
(
Math.floor(y)
*
1400+
Math.floor(x)
)
*4;

return{

r:
source[i],

g:
source[i+1],

b:
source[i+2]

};

}

function luminance(
r,
g,
b
){

return
0.2126*r+
0.7152*g+
0.0722*b;

}

function render(){

if(!image)return;

clear();

const COUNT=
90000;

for(
let n=0;
n<COUNT;
n++
){

let x=
rng()*1400;

let y=
rng()*1400;

let c=
sample(
x,
y
);

if(
c.r>248&&
c.g>248&&
c.b>248
)
continue;

let l=
luminance(
c.r,
c.g,
c.b
);

let darkness=
1-
l/255;

let probability=

0.02+

darkness*
0.98;

if(
rng()
>
probability
)
continue;

ctx.fillStyle=
`rgb(
${c.r},
${c.g},
${c.b}
)`;

let type=
rng();

let px=
x+
(
rng()-.5
)*6;

let py=
y+
(
rng()-.5
)*6;

if(
type<
0.35
){

let r=

0.8+

darkness*
5;

ctx.beginPath();

ctx.arc(
px,
py,
r,
0,
7
);

ctx.fill();

}

else{

let h=

1.8+

darkness*
5;

let w=

h*
(
2+
rng()*5
);

let angle=

(
rng()-.5
)
*.12;

ctx.save();

ctx.translate(
px,
py
);

ctx.rotate(
angle
);

capsule(
-w/2,
-h/2,
w,
h
);

ctx.restore();

}

}

}

function capsule(
x,
y,
w,
h
){

ctx.beginPath();

ctx.moveTo(
x+h/2,
y
);

ctx.lineTo(
x+w-h/2,
y
);

ctx.arc(
x+w-h/2,
y+h/2,
h/2,
-Math.PI/2,
Math.PI/2
);

ctx.lineTo(
x+h/2,
y+h
);

ctx.arc(
x+h/2,
y+h/2,
h/2,
Math.PI/2,
-Math.PI/2
);

ctx.closePath();

ctx.fill();

}

download.onclick=()=>{

let a=
document.createElement(
"a"
);

a.href=
canvas.toDataURL(
"image/png"
);

a.download=
"particle-raster.png";

a.click();

};

</script>
