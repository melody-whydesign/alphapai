<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot-Dash Image Generator</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --accent-color: #000000;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Left Control Panel */
        .sidebar {
            width: 360px;
            min-width: 360px;
            border-right: 1px solid var(--border-color);
            background: #fafafa;
            padding: 40px 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        /* Immersive Right Viewport Area */
        .main-preview {
            flex-grow: 1;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            height: 100%;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin: 0 0 12px 0;
            text-transform: uppercase;
        }

        p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
            margin: 0;
        }

        .controls-stack {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="range"] {
            appearance: none;
            background: #e0e0e0;
            height: 4px;
            border-radius: 2px;
            outline: none;
            width: 100%;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }

        .file-upload-btn {
            background: var(--accent-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .file-upload-btn:hover {
            background: #333;
        }

        input[type="file"] {
            display: none;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 32px;
            border-top: 1px solid #eeeeee;
            padding-top: 24px;
        }

        .action-btn {
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: none;
            transition: all 0.2s ease;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .action-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        #animateBtn {
            background: var(--accent-color);
            color: #ffffff;
        }
        #animateBtn:hover {
            background: #333333;
        }
        
        #recordBtn {
            border-color: #555;
            color: #555;
        }
        #recordBtn:hover {
            background: #555;
            color: white;
        }

        /* Seamless Floating Canvas Output Setup */
        canvas {
            max-width: 100%;
            max-height: calc(100vh - 80px);
            object-fit: contain;
            display: block;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            border-radius: 2px;
        }

        /* Mobile Viewport Management Overrides */
        @media (max-width: 850px) {
            body {
                flex-direction: column;
                overflow: auto;
                height: auto;
            }
            .sidebar {
                width: 100%;
                min-width: 100%;
                height: auto;
                padding: 30px 20px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .main-preview {
                height: auto;
                min-height: 500px;
                padding: 20px;
            }
            canvas {
                max-height: 70vh;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <header>
                <h1>Dot-Dash Image Generator</h1>
                <p>An interactive dynamic identity platform. Upload artwork to create stylized modular rows that burst outwards in a radial grid layout.</p>
            </header>

            <div class="controls-stack">
                <div class="control-group">
                    <label for="imageLoader">Select Image</label>
                    <button class="file-upload-btn" onclick="document.getElementById('imageLoader').click()">Choose File</button>
                    <input type="file" id="imageLoader" accept="image/*">
                </div>

                <div class="control-group">
                    <label for="lineHeightSlider">Line Height (Dot Size)</label>
                    <input type="range" id="lineHeightSlider" min="6" max="36" value="16" step="1">
                </div>

                <div class="control-group">
                    <label for="contrastThreshold">Contrast Threshold</label>
                    <input type="range" id="contrastThreshold" min="10" max="245" value="128">
                </div>
            </div>
            
            <div class="button-group">
                <button id="animateBtn" class="action-btn">Animate Motion</button>
                <button id="downloadBtn" class="action-btn">Download Image</button>
                <button id="recordBtn" class="action-btn">Download Animation</button>
            </div>
        </div>
    </div>

    <div class="main-preview">
        <canvas id="imageCanvas"></canvas>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const lhSlider = document.getElementById('lineHeightSlider');
        const contrastSlider = document.getElementById('contrastThreshold');
        const downloadBtn = document.getElementById('downloadBtn');
        const animateBtn = document.getElementById('animateBtn');
        const recordBtn = document.getElementById('recordBtn');

        let originalImage = null;
        let vectorElements = []; 
        let animationFrameId = null;
        let isAnimating = false;
        let timeParam = 0; 

        // Recording parameters
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        imageLoader.addEventListener('change', handleImage, false);
        lhSlider.addEventListener('input', () => { stopAnimation(); processImage(); });
        contrastSlider.addEventListener('input', () => { stopAnimation(); processImage(); });
        animateBtn.addEventListener('click', toggleAnimation);
        recordBtn.addEventListener('click', startRecordingLoop);

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                originalImage = new Image();
                originalImage.onload = function() {
                    const maxDim = 1000; 
                    let width = originalImage.width;
                    let height = originalImage.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                    }

                    canvas.width = Math.floor(width);
                    canvas.height = Math.floor(height);
                    stopAnimation();
                    processImage();
                    downloadBtn.style.display = 'block';
                    animateBtn.style.display = 'block';
                    recordBtn.style.display = 'block';
                }
                originalImage.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function processImage() {
            if (!originalImage) return;

            const offscreen = document.createElement('canvas');
            const offCtx = offscreen.getContext('2d');
            offscreen.width = canvas.width;
            offscreen.height = canvas.height;
            offCtx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            
            const imgData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
            const pixels = imgData.data;

            const rowSpacing = parseInt(lhSlider.value); 
            const threshold = parseInt(contrastSlider.value);
            
            vectorElements = []; 

            for (let y = Math.floor(rowSpacing / 2); y < canvas.height; y += rowSpacing) {
                let inDrawingSegment = false;
                let segmentStartX = 0;

                for (let x = 0; x < canvas.width; x++) {
                    const idx = (Math.floor(y) * canvas.width + x) * 4;
                    if (idx >= pixels.length) break;

                    const brightness = 0.2126 * pixels[idx] + 0.7152 * pixels[idx+1] + 0.0722 * pixels[idx+2];

                    if (brightness < threshold) {
                        if (!inDrawingSegment) {
                            inDrawingSegment = true;
                            segmentStartX = x;
                        }
                    } else {
                        if (inDrawingSegment) {
                            segmentShatter(segmentStartX, x, y, rowSpacing);
                            inDrawingSegment = false;
                        }
                    }
                }
                if (inDrawingSegment) {
                    segmentShatter(segmentStartX, canvas.width, y, rowSpacing);
                }
            }
            render(); 
        }

        function segmentShatter(startX, endX, y, rowSpacing) {
            let currentX = startX;
            const totalWidth = endX - startX;
            const baseGap = Math.max(3, rowSpacing * 0.35);

            if (totalWidth <= rowSpacing * 0.6) {
                registerElement(startX, endX, y, rowSpacing, true);
                return;
            }

            const dotSize = Math.max(2, rowSpacing * 0.2);
            const microDashSize = rowSpacing * 0.7; 
            const standardDashSize = rowSpacing * 1.8; 

            let alternateCounter = 0;

            while (currentX < endX) {
                let remaining = endX - currentX;

                if (remaining < dotSize) {
                    break;
                }

                let selectionMode = alternateCounter % 3;
                alternateCounter++;

                if (selectionMode === 0 || remaining < microDashSize) {
                    let targetX = Math.min(endX, currentX + dotSize);
                    registerElement(currentX, targetX, y, rowSpacing, true);
                    currentX = targetX + baseGap;
                } else if (selectionMode === 1 || remaining < standardDashSize) {
                    let targetX = Math.min(endX, currentX + microDashSize);
                    registerElement(currentX, targetX, y, rowSpacing, false);
                    currentX = targetX + baseGap;
                } else {
                    let targetX = Math.min(endX, currentX + standardDashSize);
                    registerElement(currentX, targetX, y, rowSpacing, false);
                    currentX = targetX + baseGap;
                }
            }
        }

        function registerElement(startX, endX, y, rowSpacing, forcedDot) {
            if (endX <= startX) return;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const elementCenterX = startX + (endX - startX) / 2;
            
            // Calculate direction vectors relative to center for multidirectional/radial explosion
            const maxShiftX = (Math.random() - 0.5) * (canvas.width * 0.35); 
            
            // NEW: Add random vertical shift parameter range
            const maxShiftY = (Math.random() - 0.5) * (canvas.height * 0.25);
            
            let morphDelta = (Math.random() - 0.5) * (rowSpacing * 3.5);

            vectorElements.push({
                homeX1: startX,
                homeX2: endX,
                homeY: y, // Remember baseline row height
                lineWidth: rowSpacing * 0.55,
                isDot: forcedDot,
                shiftX: maxShiftX,
                shiftY: maxShiftY, // Added vertical expansion multiplier
                morph: morphDelta,
                speedModifier: 0.5 + Math.random() * 0.5 
            });
        }

        function render() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#000000";
            ctx.fillStyle = "#000000";
            ctx.lineCap = "round";

            let easeParam = 0; 

            // SINGLE EXPANSION TIMELINE SYSTEM
            if (timeParam < Math.PI) {
                // Segment A: Single Smooth Expansion Outward
                let norm = timeParam / Math.PI;
                easeParam = Math.sin(norm * (Math.PI / 2));
            } 
            else if (timeParam >= Math.PI && timeParam < Math.PI + 0.5) {
                // Segment B: 0.5 Second Hold at Max Expanded State
                easeParam = 1;
            } 
            else if (timeParam >= Math.PI + 0.5 && timeParam < Math.PI * 2 + 0.5) {
                // Segment C: Smooth Return Collapse back to Baseline Shape
                let norm = (timeParam - (Math.PI + 0.5)) / Math.PI;
                easeParam = Math.cos(norm * (Math.PI / 2));
            }
            else {
                // Segment D: 1.0 Second Rest State Pause before re-triggering next cycle
                easeParam = 0;
            }

            for (let i = 0; i < vectorElements.length; i++) {
                const el = vectorElements[i];
                ctx.lineWidth = el.lineWidth;

                // Scale shift vectors with uniform frame easing properties
                let totalEase = easeParam * el.speedModifier;
                
                let currentShiftX = el.shiftX * totalEase;
                let currentShiftY = el.shiftY * totalEase; // Apply vertical ease shift
                let currentMorph = el.morph * totalEase;

                let origCenterX = el.homeX1 + (el.homeX2 - el.homeX1) / 2;
                let newCenterX = origCenterX + currentShiftX;
                
                // New dynamic Y location coordinate position mapping
                let newCenterY = el.homeY + currentShiftY;
                
                let newLength = Math.max(1, (el.homeX2 - el.homeX1) + currentMorph);

                // KEEP THE APPEARANCE HORIZONTAL: 
                // Keep drawing x1 and x2 on a horizontal plane using the modified newCenterY parameter coordinate.
                let x1 = newCenterX - newLength / 2;
                let x2 = newCenterX + newLength / 2;

                if (el.isDot || newLength <= ctx.lineWidth * 0.8) {
                    ctx.beginPath();
                    ctx.arc(newCenterX, newCenterY, ctx.lineWidth / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(x1, newCenterY);
                    ctx.lineTo(x2, newCenterY);
                    ctx.stroke();
                }
            }
        }

        function toggleAnimation() {
            if (isAnimating) {
                stopAnimation();
            } else {
                isAnimating = true;
                animateBtn.innerText = "Stop Loop";
                tick();
            }
        }

        function stopAnimation() {
            isAnimating = false;
            animateBtn.innerText = "Animate Motion";
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            timeParam = 0;
            render();
        }

        function tick() {
            if (!isAnimating && !isRecording) return;
            
            timeParam += 0.038; 
            
            // Core Single Expansion Loop Limit Boundary Condition Check (2 Full PIs + 1.5 Delay Windows)
            const targetLoopLimit = Math.PI * 2 + 1.5;
            if (timeParam > targetLoopLimit) {
                timeParam -= targetLoopLimit; 
                if (isRecording) {
                    mediaRecorder.stop();
                    isRecording = false;
                    recordBtn.innerText = "Download Animation";
                }
            }

            render();
            if (isAnimating || isRecording) {
                animationFrameId = requestAnimationFrame(tick);
            }
        }

        function startRecordingLoop() {
            if (isRecording) return;
            
            stopAnimation();
            isRecording = true;
            recordedChunks = [];
            timeParam = 0; 
            recordBtn.innerText = "Recording...";

            const stream = canvas.captureStream(30); 
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'dot-dash-kinetic-art.webm';
                a.click();
                window.URL.revokeObjectURL(url);
                stopAnimation();
            };

            mediaRecorder.start();
            tick(); 
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'dot-dash-image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
