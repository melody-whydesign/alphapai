<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Hybrid Dot–Dash</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,system-ui;
}

body{
background:
linear-gradient(
180deg,
#fff,
#f5f7fa
);

padding:60px;

display:flex;

justify-content:center;
}

.container{
width:min(1200px,100%);
}

.hero{
text-align:center;
margin-bottom:40px;
}

h1{

font-size:72px;

background:
linear-gradient(
90deg,
#111,
#555
);

-webkit-background-clip:text;

color:transparent;

}

.sub{
color:#777;
margin-top:12px;
}

.panel{

background:
rgba(255,255,255,.75);

backdrop-filter:
blur(40px);

padding:28px;

border-radius:32px;

box-shadow:
0 20px 80px rgba(0,0,0,.08);

}

.controls{

display:flex;

gap:14px;

justify-content:center;

flex-wrap:wrap;

margin-bottom:24px;

}

.file{

height:56px;

padding:0 22px;

display:flex;

align-items:center;

background:#f3f4f6;

border-radius:999px;

}

button{

height:56px;

padding:0 24px;

border:none;

border-radius:999px;

background:
linear-gradient(
90deg,
#111,
#444
);

color:white;

cursor:pointer;

}

canvas{

width:100%;

background:white;

border-radius:24px;

display:block;

}

.footer{

text-align:center;

margin-top:18px;

color:#777;

}

</style>

</head>

<body>

<div class="container">

<div class="hero">

<h1>Hybrid Dot–Dash</h1>

<div class="sub">

Upload → Generate → Regenerate → Export

</div>

</div>

<div class="panel">

<div class="controls">

<label class="file">

<input
id="upload"
type="file"
accept="image/*">

</label>

<button id="generate">
Generate
</button>

<button id="regen">
Regenerate
</button>

<button id="save">
Export PNG
</button>

</div>

<canvas id="canvas"></canvas>

</div>

<div class="footer">

Generative particle raster

</div>

</div>

<script>

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

canvas.width=1600;
canvas.height=1600;

let image=null;
let imageData=null;
let seed=1;

function rand(){

seed=
(
seed*
16807
)%2147483647;

return(
seed-1
)/2147483646;

}

function clear(){

ctx.fillStyle=
"#fff";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

}

clear();

function fit(){

const scale=
Math.min(
1200/image.width,
1200/image.height
);

return{

w:
image.width*scale,

h:
image.height*scale,

x:
(
1600-
image.width*scale
)/2,

y:
(
1600-
image.height*scale
)/2

};

}

upload.onchange=e=>{

const file=
e.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=()=>{

image=
new Image();

image.onload=()=>{

prepare();

preview();

};

image.src=
reader.result;

};

reader.readAsDataURL(
file
);

};

function prepare(){

const temp=
document.createElement(
"canvas"
);

temp.width=
1600;

temp.height=
1600;

const t=
temp.getContext(
"2d"
);

t.fillStyle=
"#fff";

t.fillRect(
0,
0,
1600,
1600
);

const s=
fit();

t.drawImage(
image,
s.x,
s.y,
s.w,
s.h
);

imageData=
t.getImageData(
0,
0,
1600,
1600
);

}

function preview(){

clear();

const s=
fit();

ctx.drawImage(
image,
s.x,
s.y,
s.w,
s.h
);

}

function pixel(x,y){

const i=
(
(
y|0
)
*
1600+
(
x|0
)
)
*4;

const d=
imageData.data;

return{

r:d[i],
g:d[i+1],
b:d[i+2]

};

}

function render(){

if(!imageData)
return;

clear();

for(

let i=0;

i<140000;

i++

){

let x=
rand()*1600;

let y=
rand()*1600;

let p=
pixel(
x,
y
);

if(

p.r>248&&
p.g>248&&
p.b>248

)

continue;

let bright=

(
p.r+
p.g+
p.b
)/3;

let dark=

1-
bright/
255;

/* keep more particles */

if(

rand()>

(
0.35+
dark*
0.65
)

)

continue;

ctx.fillStyle=
`rgb(
${p.r},
${p.g},
${p.b}
)`;

/* DOT */

if(
rand()<0.28
){

ctx.beginPath();

ctx.arc(

x+
(
rand()-.5
)*8,

y+
(
rand()-.5
)*8,

1+
dark*7,

0,

7

);

ctx.fill();

}

/* DASH */

else{

let h=

2+
dark*8;

let w=

h*
(
2+
rand()*6
);

ctx.save();

ctx.translate(

x+
(
rand()-.5
)*8,

y+
(
rand()-.5
)*8

);

ctx.rotate(

(
rand()-.5
)
*.08

);

ctx.beginPath();

ctx.roundRect(

-w/2,

-h/2,

w,

h,

h

);

ctx.fill();

ctx.restore();

}

}

}

generate.onclick=()=>{

seed=
Date.now();

render();

};

regen.onclick=()=>{

seed+=100;

render();

};

save.onclick=()=>{

const a=
document.createElement(
"a"
);

a.href=
canvas.toDataURL();

a.download=
"hybrid-dot-dash.png";

a.click();

};

</script>

</body>

</html>
